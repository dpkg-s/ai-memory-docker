name: release

# 为什么需要这个 workflow
# ----------------------
# 本仓此前没有 CI：tag 推上来之后不会自动建 Release，全靠人记得手工 `gh release create`。
# 发布流程技能里把它记成「最容易漏发布的一环」——2026-10-27 实际就漏了一次：
# v1.1.2 的 tag 已经推上去，Release 却不存在，门禁 G4 会判「tag 已推但无 Release」。
#
# 现在改为：tag 推上来自动建；另外 master 有推送时兜底检查一次（补历史上漏发的那一个），
# 也留 workflow_dispatch 供手工补发。
#
# 正文优先取 `.github/release-notes/<tag>.md`（用户视角、人工筛过）；
# 没有该文件时退回 CHANGELOG 里对应版本的段落，至少不会是一句空话。

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release if missing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史与全部 tag：master 兜底逻辑要靠 git tag 找最新版本
          fetch-depth: 0

      - name: Resolve target tag
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            # master 推送或手工触发：取语义版本最大的 tag
            TAG="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          fi
          if [ -z "$TAG" ]; then
            echo "没有找到 v* 标签，跳过。"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "目标标签：$TAG"

      - name: Create release
        if: steps.target.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.target.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 的 Release 已存在，无事可做。"
            exit 0
          fi

          NOTES=".github/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            VER="${TAG#v}"
            # 取 CHANGELOG 里 `## [VER]` 到下一个 `## [` 之间的内容
            awk -v v="$VER" '
              /^## \[/ {
                if (index($0, "[" v "]")) { keep=1; next }
                else if (keep) { exit }
              }
              keep { print }
            ' CHANGELOG.md > /tmp/notes.md
            NOTES=/tmp/notes.md
          fi

          if [ ! -s "$NOTES" ]; then
            printf '本版无功能变更。\n' > /tmp/notes.md
            NOTES=/tmp/notes.md
          fi

          # 标题：三仓统一取**带注释 tag 的 subject**（`git tag -a v1.1.2 -m "v1.1.2 — 一句话"`）。
          # 走 API 而不是本地 `git tag -l --format='%(contents:subject)'`：runner 上本地 tag
          # 未必是带注释形态，该占位符会静默退回被指向提交的主题（核心仓 v3.0.0 曾因此把
          # Release 标题写成 commit subject）。任何一步失败都回落为 tag 名。
          TITLE=""
          OBJ="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                   --jq '.object.type + " " + .object.sha' 2>/dev/null || true)"
          KIND="${OBJ%% *}"; SHA="${OBJ##* }"
          if [ "$KIND" = "tag" ]; then
            SUBJ="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" \
                     --jq '.message' 2>/dev/null | head -n1 || true)"
            if [ -n "$SUBJ" ]; then TITLE="$SUBJ"; fi
          fi
          if [ -z "$TITLE" ]; then TITLE="$TAG"; fi

          # 正文文件只放正文，**不写 H1** —— 标题已经由 tag 注释提供了。这里仍防御性
          # 剥掉首行 H1，避免有人照旧格式写了之后 Release 里标题重复一遍。
          sed '1{/^#[[:space:]]/d}' "$NOTES" > /tmp/notes_body.md
          if [ -s /tmp/notes_body.md ]; then
            NOTES=/tmp/notes_body.md
          else
            printf '本版无功能变更。\n' > /tmp/notes_body.md
            NOTES=/tmp/notes_body.md
          fi

          echo "release title = $TITLE"
          gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES" --verify-tag

      # ── 正文同步（2026-11-19）────────────────────────────────────────────
      # 背景：本机 gh keyring 里的 token 失效，`gh release edit` 一律 401，而
      # device flow 的授权需要人去浏览器点（多次超时）。CI 自带 `github.token`
      # 且本 workflow 已有 `contents: write`，于是把「改正文」这件事交给 CI。
      #
      # 触发时机：master 有推送时（含上面刚 create 完的分支）把仓库内
      # `.github/release-notes/<最新 tag>.md` 同步到该 tag 的远端 Release 正文。
      # 幂等：正文相同就不写；仓库里没有对应 notes 就跳过，不改自动生成正文。
      # ⇒ 仓库内 release-notes 是唯一事实源；人工在 GitHub 网页改的正文会被
      #   下次 push 覆盖（这是有意的：避免两处维护漂移）。
      - name: Sync release body from repo notes
        if: steps.target.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES=".github/release-notes/${TAG}.md"
          if [ ! -s "$NOTES" ]; then
            echo "无 ${NOTES}，跳过正文同步（保留 Release 现有正文）。"
            exit 0
          fi
          # 与 Create release 一致：剥掉首行 H1，标题由 tag 注释提供。
          sed '1{/^#[[:space:]]/d}' "$NOTES" > /tmp/body.md
          if [ ! -s /tmp/body.md ]; then
            printf '本版无功能变更。\n' > /tmp/body.md
          fi
          CURRENT="$(gh release view "$TAG" --json body --jq '.body // ""' 2>/dev/null || true)"
          if [ "$CURRENT" = "$(cat /tmp/body.md)" ]; then
            echo "$TAG 正文已是最新，无需改动。"
            exit 0
          fi
          gh release edit "$TAG" --notes-file /tmp/body.md
          echo "已用 ${NOTES} 同步 $TAG 的 Release 正文。"
